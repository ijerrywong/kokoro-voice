<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kokoro 声音实验室</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a66;--line:#e2e0da;--acc:#d9480f;--acc-ink:#fff;--soft:#fbeee6}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--ink:#ecebe7;--mute:#9a9893;--line:#33322f;--acc:#ff7a3d;--acc-ink:#161615;--soft:#2c221c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif}
header{padding:18px 20px 6px}
h1{margin:0;font-size:20px}
header p{margin:4px 0 0;color:var(--mute);font-size:13px}
main{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:16px;padding:12px 20px 40px}
@media (max-width:820px){main{grid-template-columns:1fr;padding:12px 16px 40px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
h2{font-size:13px;letter-spacing:.04em;color:var(--mute);margin:0 0 10px;font-weight:600}
textarea,input[type=text],select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--mute);cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.ctl{margin:12px 0}
.ctl .top{display:flex;justify-content:space-between;align-items:baseline}
.ctl label{font-weight:600;font-size:14px}
.ctl output{font-variant-numeric:tabular-nums;font-weight:600;color:var(--acc)}
.ctl small{display:block;color:var(--mute);font-size:12px;line-height:1.4}
input[type=range]{width:100%;accent-color:var(--acc);margin:4px 0 0}
button.main{width:100%;padding:11px;border:0;border-radius:9px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:700;cursor:pointer;margin-top:6px}
button.main:disabled{opacity:.5;cursor:wait}
button.sm{font:inherit;font-size:12px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
button.sm:hover{border-color:var(--mute)}
.stack{display:grid;gap:16px;align-content:start}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-of-type{border-top:0}
.item .head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item b{font-size:14px}
.item .p{font-size:12px;color:var(--mute);font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.item .note{font-size:13px;color:var(--mute)}
.item .acts{display:flex;gap:6px;flex-wrap:wrap}
audio{width:100%;height:34px;margin-top:6px}
.new{background:var(--soft);border-radius:8px;padding:10px;margin:-2px -6px 0}
.tag{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
.empty{color:var(--mute);font-size:13px}
.err{color:#c92a2a;font-size:13px;margin-top:8px}
.save{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:10px}
@media (max-width:520px){.save{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Kokoro 声音实验室</h1>
  <p>调参数 → 生成试听 → 满意的存成预设。你存的预设在 ~/.local/share/kokoro-voice/presets.json，批量配音时按名字调用。</p>
</header>
<main>
  <section class="card" id="panel">
    <h2>台词</h2>
    <textarea id="text">Hi! My name is Tom. I like apples and I can run fast!</textarea>
    <div class="chips" id="samples"></div>

    <h2>基础声音（模型阶段）</h2>
    <div class="row">
      <select id="vA"></select>
      <select id="vB"><option value="">（不混合）</option></select>
    </div>
    <div class="ctl" id="mixWrap"></div>
    <div id="ctls"></div>
    <button class="main" id="go">生成并播放（⌘/Ctrl + Enter）</button>
    <div class="err" id="err"></div>
  </section>

  <div class="stack">
    <section class="card">
      <div class="head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <h2 style="margin:0">预设</h2>
        <button class="sm" id="all">用当前台词把全部预设读一遍</button>
      </div>
      <div id="presets"></div>
    </section>
    <section class="card">
      <h2>试听记录（最新在上）</h2>
      <div id="hist"><p class="empty">还没有。调好参数点「生成并播放」。</p></div>
    </section>
  </div>
</main>
<script>
const SAMPLES = [
  'Hi! My name is Tom. I like apples and I can run fast!',
  'Look! A big red bus! Can we go to the park, please?',
  'Thank you, Ms Xu. I can help you clean the classroom.',
  'Cat. Dog. Bird. Apple. Banana.',
  'Once upon a time, there was a little rabbit who lived in the forest.'
];
const CTLS = [
  ['speed','语速 speed',0.5,1.5,0.05,1,'Kokoro 直接按这个速度生成，不是事后拉伸。小孩、跟读材料常用 0.8–0.9。'],
  ['formant','共鸣 formant',0.8,1.45,0.01,1,'声道长短。>1 像更小的身体（小孩约 1.15–1.3），<1 像更大的人。最影响「像不像小孩」。'],
  ['pitch','音高 pitch',0.6,2.4,0.01,1,'只改嗓音高低，不改共鸣。小孩说话约 250–300Hz：女声底子 ×1.2–1.4，男声底子 ×2 左右。'],
  ['range','语调起伏 range',0.3,2.5,0.05,1,'句子里高低变化的幅度。>1 更活泼、像小孩兴奋说话；<1 更平、更像机器或疲惫。'],
  ['highpass','低切 highpass (Hz)',0,400,10,0,'切掉这个频率以下的声音。100–200 让声音更「薄」、少胸腔感。0 = 关。'],
  ['bright','明亮 bright (dB)',-8,10,0.5,0,'3kHz 以上加减。>0 更脆更亮，<0 更闷更柔。'],
];
const $ = s => document.querySelector(s);
let meta = {voices:[], presets:{}};

function slider([k,label,min,max,step,def,hint]){
  return `<div class="ctl"><div class="top"><label for="${k}">${label}</label><output id="${k}_o">${def}</output></div>
  <input type="range" id="${k}" min="${min}" max="${max}" step="${step}" value="${def}"><small>${hint}</small></div>`;
}
$('#ctls').innerHTML = CTLS.map(slider).join('');
$('#mixWrap').innerHTML = slider(['mix','混合比例（第二个声音占多少）',0,1,0.05,0.3,'两个声音的特征向量按比例相加，得到一个新声音。0 = 只用第一个。']);
$('#samples').innerHTML = SAMPLES.map((s,i)=>`<button class="chip" data-i="${i}">${s.length>26?s.slice(0,26)+'…':s}</button>`).join('');
$('#samples').onclick = e => { const i = e.target.dataset.i; if(i!=null) $('#text').value = SAMPLES[i]; };
document.querySelectorAll('input[type=range]').forEach(r => r.oninput = () => $('#'+r.id+'_o').textContent = r.value);
$('#vB').onchange = () => $('#mixWrap').style.display = $('#vB').value ? '' : 'none';

function params(){
  const p = {}, A = $('#vA').value, B = $('#vB').value, m = +$('#mix').value;
  p.voice = (B && m>0) ? (m>=1 ? B : {[A]: +(1-m).toFixed(2), [B]: m}) : A;
  for (const [k,,,,,def] of CTLS){ const v = +$('#'+k).value; if (v !== def) p[k] = v; }
  return p;
}
function load(p){
  const v = p.voice;
  if (typeof v === 'string'){ $('#vA').value = v; $('#vB').value = ''; }
  else { const [a,b] = Object.keys(v); const t = v[a]+(v[b]||0);
    $('#vA').value = a; $('#vB').value = b||''; $('#mix').value = b ? (v[b]/t).toFixed(2) : 0; }
  for (const [k,,,,,def] of CTLS) $('#'+k).value = p[k] ?? def;
  document.querySelectorAll('input[type=range]').forEach(r => r.oninput());
  $('#vB').onchange();
}
const desc = p => {
  const v = typeof p.voice==='string' ? p.voice : Object.entries(p.voice).map(([k,w])=>`${k}×${w}`).join('+');
  return [v, ...CTLS.filter(([k])=>p[k]!=null).map(([k])=>`${k} ${p[k]}`)].join(' · ');
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, body){
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json(); if (!r.ok) throw new Error(j.error); return j;
}
async function synth(p, label){
  const text = $('#text').value.trim(); if (!text) return;
  $('#err').textContent = ''; $('#go').disabled = true;
  try{
    const {url} = await api('/api/synth', {text, params:p});
    addHist(p, url, label, text);
  }catch(e){ $('#err').textContent = '出错：' + e.message; }
  finally{ $('#go').disabled = false; }
}
function addHist(p, url, label, text){
  const h = $('#hist'); if (h.querySelector('.empty')) h.innerHTML = '';
  h.querySelectorAll('.new').forEach(n => n.classList.remove('new'));
  const d = document.createElement('div'); d.className = 'item new';
  d.innerHTML = `<div class="head"><b>${esc(label||'自调')}</b><div class="acts">
    <button class="sm" data-a="load">载入参数</button><button class="sm" data-a="save">存为预设…</button></div></div>
    <div class="note">${esc(text)}</div><div class="p">${esc(desc(p))}</div>
    <audio controls src="${url}"></audio>
    <div class="save" hidden><input type="text" placeholder="预设名，如 child_girl_6" value="${esc(label&&label!=='自调'?label:'')}">
    <input type="text" placeholder="说明：适合什么场景"><button class="sm" data-a="ok">保存</button></div>`;
  d.onclick = async e => {
    const a = e.target.dataset.a;
    if (a==='load') load(p);
    if (a==='save') d.querySelector('.save').hidden = false;
    if (a==='ok'){ const [n,note] = d.querySelectorAll('.save input'); if(!n.value.trim()) return n.focus();
      meta.presets = (await api('/api/preset', {name:n.value.trim(), params:p, note:note.value})).presets;
      drawPresets(); d.querySelector('.save').hidden = true; }
  };
  h.prepend(d); d.querySelector('audio').play().catch(()=>{});
}
function drawPresets(){
  const ps = Object.entries(meta.presets);
  $('#presets').innerHTML = ps.length ? ps.map(([n,p]) => `<div class="item" data-n="${esc(n)}"><div class="head"><b>${esc(n)}</b>${p.mine?'':' <span class="tag">内置</span>'}
    <div class="acts"><button class="sm" data-a="play">试听</button><button class="sm" data-a="load">载入</button>${p.mine?'<button class="sm" data-a="del">删除</button>':''}</div></div>
    ${p.note?`<div class="note">${esc(p.note)}</div>`:''}<div class="p">${esc(desc(p))}</div></div>`).join('')
    : '<p class="empty">还没有预设。</p>';
}
const strip = p => { const {note, mine, ...rest} = p; return rest; };
$('#presets').onclick = async e => {
  const a = e.target.dataset.a, n = e.target.closest('.item')?.dataset.n; if (!a) return;
  const p = strip(meta.presets[n]);
  if (a==='play') synth(p, n);
  if (a==='load') load(p);
  if (a==='del' && confirm(`删除预设 ${n}？`)){ meta.presets = (await api('/api/preset', {name:n, delete:true})).presets; drawPresets(); }
};
$('#all').onclick = async () => { for (const [n,p] of Object.entries(meta.presets)) await synth(strip(p), n); };
$('#go').onclick = () => synth(params());
document.onkeydown = e => { if (e.key==='Enter' && (e.metaKey||e.ctrlKey)) synth(params()); };

fetch('/api/meta').then(r=>r.json()).then(m => {
  meta = m;
  const opts = m.voices.map(v=>`<option>${v}</option>`).join('');
  $('#vA').innerHTML = opts; $('#vB').innerHTML += opts; $('#vA').value = 'af_bella';
  $('#vB').onchange(); drawPresets();
});
</script>
</body>
</html>
